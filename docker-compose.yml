services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: vixir
      POSTGRES_USER: ${VIXIR_DB_USER:-vixir}
      POSTGRES_PASSWORD: ${VIXIR_DB_PASSWORD:-vixir}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${VIXIR_DB_USER:-vixir}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Override DB URL so the API reaches the postgres service by name, not localhost
      VIXIR_DB_URL: jdbc:postgresql://postgres:5432/vixir
      VIXIR_WEB_ORIGINS: http://localhost:5173
      SPRING_PROFILES_ACTIVE: demo
      PORT: 8081
    ports:
      - "8081:8081"

volumes:
  pgdata:
