name: Deploy Production (Firebase + Render)

# Runs on every push to main (or manual dispatch).
# Strictly gated: Gitleaks + Semgrep + Web/API/Agent tests MUST pass before Firebase or Render deploys run.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  security-gitleaks:
    name: Gate · Gitleaks secrets scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  security-semgrep:
    name: Gate · Semgrep SAST & secrets
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.106.0
    steps:
      - uses: actions/checkout@v4
      - name: Run blocking Semgrep scan
        run: |
          semgrep scan \
            --config p/owasp-top-ten \
            --config p/secrets \
            --config p/python \
            --config p/java \
            --config p/typescript \
            --config p/react \
            --config p/dockerfile \
            --error \
            --severity ERROR \
            --exclude 'node_modules' \
            --exclude 'dist' \
            --exclude '.venv' \
            --exclude 'build' \
            .

  verify-web:
    name: Gate · Web typecheck & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate:experiments
      - run: pnpm turbo run typecheck test

  verify-agent:
    name: Gate · Vix Agent ruff & pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/vix-agent
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest -q

  verify-api:
    name: Gate · Spring Boot API build & tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon build

  deploy-firebase-web:
    name: Deploy Frontend → Firebase Hosting
    needs: [security-gitleaks, security-semgrep, verify-web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build production web bundle
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_VIX_AGENT_URL: ${{ secrets.VITE_VIX_AGENT_URL }}
        run: pnpm --filter @vixir/web build
      - name: Deploy to Firebase Hosting (live)
        if: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' && secrets.FIREBASE_PROJECT_ID != '' }}
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}
          channelId: live
      - name: Skip notice when Firebase secrets are not yet configured
        if: ${{ secrets.FIREBASE_SERVICE_ACCOUNT == '' || secrets.FIREBASE_PROJECT_ID == '' }}
        run: echo "FIREBASE_SERVICE_ACCOUNT or FIREBASE_PROJECT_ID secret not set — build succeeded, skipping Firebase upload."

  deploy-render-api:
    name: Deploy API → Render
    needs: [security-gitleaks, security-semgrep, verify-api]
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render API deploy hook
        env:
          HOOK: ${{ secrets.RENDER_API_DEPLOY_HOOK || secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "RENDER_API_DEPLOY_HOOK not set — skipping Render API deploy."
            exit 0
          fi
          curl -fsS --max-time 30 -X POST "$HOOK"

  deploy-render-agent:
    name: Deploy Vix Agent → Render
    needs: [security-gitleaks, security-semgrep, verify-agent]
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Vix Agent deploy hook
        env:
          HOOK: ${{ secrets.RENDER_AGENT_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "RENDER_AGENT_DEPLOY_HOOK not set — skipping Render Vix Agent deploy."
            exit 0
          fi
          curl -fsS --max-time 30 -X POST "$HOOK"
