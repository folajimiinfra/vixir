name: Deploy Vix agent

# Builds the agent image and pushes it to GHCR. Deploy that image to LiveKit Cloud (or any container host)
# — see apps/vix-agent/README.md. Manual trigger so agent deploys don't burn API/LLM credits by accident.
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/vix-agent" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: apps/vix-agent
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:latest
            ${{ steps.img.outputs.name }}:${{ github.sha }}
