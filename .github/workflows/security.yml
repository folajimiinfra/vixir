name: Security & Secrets Gate (Semgrep + Gitleaks)

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Secrets scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks secrets scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  semgrep:
    name: SAST & secrets scan (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.106.0
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep OWASP + language + secrets rulesets
        run: |
          semgrep scan \
            --config p/owasp-top-ten \
            --config p/secrets \
            --config p/python \
            --config p/java \
            --config p/typescript \
            --config p/react \
            --config p/dockerfile \
            --error \
            --severity ERROR \
            --exclude 'node_modules' \
            --exclude 'dist' \
            --exclude '.venv' \
            --exclude 'build' \
            --text \
            --sarif-output=semgrep.sarif \
            .
      - name: Upload Semgrep SARIF report
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
        continue-on-error: true
