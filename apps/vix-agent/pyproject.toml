[project]
name = "vix-agent"
version = "0.1.0"
description = "Vix — voice and vision lab guide for Vixir (LiveKit Agents + LangGraph)"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "livekit-agents[silero,turn-detector]>=1.2",
    "langgraph>=0.6",
    "anthropic>=0.60",
    "httpx>=0.27",
    "pydantic>=2.8",
    "structlog>=24.1",
]

[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6.100", "ruff>=0.6"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
ignore = ["BLE001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
