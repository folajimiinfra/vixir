<svg viewBox="0 0 360 300" role="img" aria-label="Isometric drawing of Petri dish, microscope slide and cover slip" xmlns="http://www.w3.org/2000/svg" width="720" height="600">
  <!-- Petri dish with nutrient agar -->
  <ellipse cx="116" cy="184" rx="58" ry="32" fill="rgba(254,240,138,0.55)" stroke="#64748B" stroke-width="1.2"/>
  <path d="M58 184 L58 198 A58 32 0 0 0 174 198 L174 184" fill="rgba(226,232,240,0.45)" stroke="#64748B" stroke-width="1.2"/>
  <!-- Culture colonies -->
  <circle cx="102" cy="180" r="4" fill="#F97316" opacity="0.8"/>
  <circle cx="126" cy="188" r="3" fill="#F97316" opacity="0.8"/>
  <circle cx="114" cy="172" r="2.5" fill="#F97316" opacity="0.8"/>

  <!-- Glass Microscope Slide -->
  <path d="M170 218 L272 166 L304 184 L202 236 Z" fill="rgba(186,230,253,0.45)" stroke="#3B82F6" stroke-width="1.1" stroke-linejoin="round"/>
  <!-- Specimen in drop of iodine stain -->
  <ellipse cx="238" cy="200" rx="12" ry="7" fill="rgba(217,119,6,0.55)" stroke="#B45309" stroke-width="0.7"/>

  <!-- Thin Cover Slip lowered at 45° with a mounted needle -->
  <path d="M224 202 L248 190 L262 162 L238 174 Z" fill="rgba(224,242,254,0.75)" stroke="#2563EB" stroke-width="1"/>
  <!-- Mounted needle supporting cover slip -->
  <line x1="254" y1="176" x2="316" y2="124" stroke="#475569" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Callouts -->
  <line x1="116" y1="176" x2="96" y2="112" stroke="#2448D8" stroke-width="0.8"/>
  <circle cx="116" cy="176" r="2" fill="#2448D8"/>
  <rect x="24" y="98" width="118" height="14" rx="3" fill="#FFFFFF" stroke="#2448D8" stroke-width="0.8"/>
  <text x="29" y="108" fill="#1A36A8" font-size="8" font-family="Inter" font-weight="600">Petri dish &amp; agar medium</text>

  <line x1="210" y1="224" x2="178" y2="262" stroke="#2448D8" stroke-width="0.8"/>
  <circle cx="210" cy="224" r="2" fill="#2448D8"/>
  <rect x="116" y="262" width="108" height="14" rx="3" fill="#FFFFFF" stroke="#2448D8" stroke-width="0.8"/>
  <text x="121" y="272" fill="#1A36A8" font-size="8" font-family="Inter" font-weight="600">Glass microscope slide</text>

  <line x1="246" y1="174" x2="226" y2="112" stroke="#2448D8" stroke-width="0.8"/>
  <circle cx="246" cy="174" r="2" fill="#2448D8"/>
  <rect x="176" y="98" width="136" height="14" rx="3" fill="#FFFFFF" stroke="#2448D8" stroke-width="0.8"/>
  <text x="181" y="108" fill="#1A36A8" font-size="8" font-family="Inter" font-weight="600">Cover slip lowered at 45° angle</text>
</svg>
