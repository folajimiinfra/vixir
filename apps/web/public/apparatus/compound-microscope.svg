<svg viewBox="0 0 360 300" role="img" aria-label="Isometric drawing of a Compound light microscope" xmlns="http://www.w3.org/2000/svg" width="720" height="600">
  <!-- Heavy isometric horseshoe base -->
  <path d="M120 250 L185 282 L245 252 L245 240 L180 208 L120 238 Z" fill="#334155" stroke="#0F172A" stroke-width="0.9" stroke-linejoin="round"/>
  <path d="M120 238 L185 270 L245 240 L180 208 Z" fill="#475569" stroke="#0F172A" stroke-width="0.9" stroke-linejoin="round"/>
  <path d="M185 270 L245 240 L245 252 L185 282 Z" fill="#1E293B" stroke="#0F172A" stroke-width="0.9" stroke-linejoin="round"/>

  <!-- Bottom LED illuminator / condenser lens on base -->
  <ellipse cx="176" cy="242" rx="18" ry="10" fill="#64748B" stroke="#0F172A" stroke-width="0.8"/>
  <ellipse cx="176" cy="239" rx="13" ry="7" fill="#93C5FD" stroke="#2563EB" stroke-width="0.8"/>

  <!-- Curved C-Arm Pillar -->
  <path d="M196 244 C 232 225, 238 145, 204 100 L 188 92 L 188 112 C 214 140, 212 208, 182 234 Z" fill="#64748B" stroke="#0F172A" stroke-width="0.9" stroke-linejoin="round"/>
  <path d="M204 100 C 238 145, 232 225, 196 244 L 208 238 C 244 218, 250 138, 214 94 Z" fill="#475569" stroke="#0F172A" stroke-width="0.9" stroke-linejoin="round"/>

  <!-- Coarse & Fine Adjustment Knobs on Arm -->
  <ellipse cx="218" cy="192" rx="13" ry="13" fill="#1E293B" stroke="#0F172A" stroke-width="0.9"/>
  <ellipse cx="222" cy="194" rx="8" ry="8" fill="#475569" stroke="#94A3B8" stroke-width="0.8"/>

  <!-- Mechanical Stage & Slide with Stage Clips -->
  <path d="M124 176 L174 202 L218 180 L168 154 Z" fill="#1E293B" stroke="#0F172A" stroke-width="0.9" stroke-linejoin="round"/>
  <path d="M124 176 L174 202 L174 208 L124 182 Z" fill="#0F172A" stroke="#0F172A" stroke-width="0.8"/>
  <path d="M174 202 L218 180 L218 186 L174 208 Z" fill="#334155" stroke="#0F172A" stroke-width="0.8"/>
  <!-- Glass specimen slide on stage -->
  <path d="M145 176 L178 193 L194 185 L161 168 Z" fill="rgba(186,230,253,0.65)" stroke="#38BDF8" stroke-width="0.8"/>
  <circle cx="170" cy="180" r="4" fill="#4ADE80" opacity="0.85" stroke="#166534" stroke-width="0.6"/>
  <!-- Stage clips -->
  <path d="M158 168 L166 177 M184 181 L176 185" stroke="#CBD5E1" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Iris Diaphragm & Condenser under stage -->
  <path d="M160 198 L160 212 A12 6 0 0 0 184 212 L184 198 Z" fill="#334155" stroke="#0F172A" stroke-width="0.8"/>

  <!-- Revolving Nosepiece & 3 Objective Lenses (×4, ×10, ×40) -->
  <ellipse cx="176" cy="126" rx="18" ry="9" fill="#475569" stroke="#0F172A" stroke-width="0.9"/>
  <!-- Objective 1 (Low power ×4 red band) -->
  <path d="M161 130 L156 152 L164 154 L169 132 Z" fill="#CBD5E1" stroke="#0F172A" stroke-width="0.8"/>
  <line x1="157" y1="147" x2="165" y2="149" stroke="#EF4444" stroke-width="2"/>
  <!-- Objective 2 (Medium power ×10 yellow band) -->
  <path d="M172 132 L172 162 L180 162 L180 132 Z" fill="#94A3B8" stroke="#0F172A" stroke-width="0.8"/>
  <line x1="172" y1="155" x2="180" y2="155" stroke="#FACC15" stroke-width="2"/>
  <!-- Objective 3 (High power ×40 blue band) -->
  <path d="M183 130 L189 158 L196 155 L190 128 Z" fill="#CBD5E1" stroke="#0F172A" stroke-width="0.8"/>
  <line x1="188" y1="152" x2="195" y2="149" stroke="#2563EB" stroke-width="2"/>

  <!-- Body Tube & Inclined Ocular Eyepiece (×10) -->
  <path d="M166 86 L166 124 A10 5 0 0 0 188 124 L188 86 Z" fill="#E2E8F0" stroke="#0F172A" stroke-width="0.9"/>
  <path d="M166 86 L142 46 L154 38 L182 82 Z" fill="#CBD5E1" stroke="#0F172A" stroke-width="0.9"/>
  <path d="M142 46 L134 32 L146 25 L154 38 Z" fill="#1E293B" stroke="#0F172A" stroke-width="0.9"/>
  <ellipse cx="140" cy="28.5" rx="7" ry="4" transform="rotate(-30 140 28.5)" fill="#60A5FA" stroke="#0F172A" stroke-width="0.8"/>

  <!-- Label Callouts -->
  <line x1="138" y1="30" x2="96" y2="26" stroke="#2448D8" stroke-width="0.8"/>
  <circle cx="138" cy="30" r="2" fill="#2448D8"/>
  <rect x="14" y="19" width="82" height="14" rx="3" fill="#FFFFFF" stroke="#2448D8" stroke-width="0.8"/>
  <text x="19" y="29" fill="#1A36A8" font-size="8" font-family="Inter" font-weight="600">Eyepiece lens (×10)</text>

  <line x1="190" y1="126" x2="236" y2="112" stroke="#2448D8" stroke-width="0.8"/>
  <circle cx="190" cy="126" r="2" fill="#2448D8"/>
  <rect x="236" y="105" width="96" height="14" rx="3" fill="#FFFFFF" stroke="#2448D8" stroke-width="0.8"/>
  <text x="241" y="115" fill="#1A36A8" font-size="8" font-family="Inter" font-weight="600">Revolving nosepiece</text>

  <line x1="176" y1="156" x2="114" y2="140" stroke="#2448D8" stroke-width="0.8"/>
  <circle cx="176" cy="156" r="2" fill="#2448D8"/>
  <rect x="14" y="133" width="100" height="14" rx="3" fill="#FFFFFF" stroke="#2448D8" stroke-width="0.8"/>
  <text x="19" y="143" fill="#1A36A8" font-size="8" font-family="Inter" font-weight="600">Objective lenses (×4–×40)</text>

  <line x1="146" y1="178" x2="104" y2="194" stroke="#2448D8" stroke-width="0.8"/>
  <circle cx="146" cy="178" r="2" fill="#2448D8"/>
  <rect x="14" y="187" width="90" height="14" rx="3" fill="#FFFFFF" stroke="#2448D8" stroke-width="0.8"/>
  <text x="19" y="197" fill="#1A36A8" font-size="8" font-family="Inter" font-weight="600">Stage &amp; stage clips</text>

  <line x1="224" y1="194" x2="254" y2="194" stroke="#2448D8" stroke-width="0.8"/>
  <circle cx="224" cy="194" r="2" fill="#2448D8"/>
  <rect x="254" y="187" width="96" height="14" rx="3" fill="#FFFFFF" stroke="#2448D8" stroke-width="0.8"/>
  <text x="259" y="197" fill="#1A36A8" font-size="8" font-family="Inter" font-weight="600">Coarse &amp; fine focus</text>

  <line x1="176" y1="240" x2="116" y2="262" stroke="#2448D8" stroke-width="0.8"/>
  <circle cx="176" cy="240" r="2" fill="#2448D8"/>
  <rect x="18" y="255" width="98" height="14" rx="3" fill="#FFFFFF" stroke="#2448D8" stroke-width="0.8"/>
  <text x="23" y="265" fill="#1A36A8" font-size="8" font-family="Inter" font-weight="600">Condenser &amp; light source</text>
</svg>
