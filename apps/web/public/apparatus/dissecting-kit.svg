<svg viewBox="0 0 360 300" role="img" aria-label="Isometric drawing of a Dissecting kit and wax tray" xmlns="http://www.w3.org/2000/svg" width="720" height="600">
  <!-- Isometric Aluminium Dissecting Dish with Dark Wax Layer -->
  <path d="M56 154 L176 218 L286 160 L166 96 Z" fill="#64748B" stroke="#0F172A" stroke-width="0.9" stroke-linejoin="round"/>
  <path d="M56 154 L176 218 L176 232 L56 168 Z" fill="#334155" stroke="#0F172A" stroke-width="0.9" stroke-linejoin="round"/>
  <path d="M176 218 L286 160 L286 174 L176 232 Z" fill="#475569" stroke="#0F172A" stroke-width="0.9" stroke-linejoin="round"/>
  <!-- Wax bed inside tray -->
  <path d="M72 154 L176 209 L270 160 L166 105 Z" fill="#2F3A2C" stroke="#1E293B" stroke-width="0.8"/>

  <!-- Dissecting Pins stuck into wax -->
  <line x1="135" y1="150" x2="135" y2="128" stroke="#CBD5E1" stroke-width="1.5"/>
  <circle cx="135" cy="126" r="3.5" fill="#EF4444" stroke="#7F1D1D" stroke-width="0.6"/>
  <line x1="205" y1="164" x2="205" y2="142" stroke="#CBD5E1" stroke-width="1.5"/>
  <circle cx="205" cy="140" r="3.5" fill="#EF4444" stroke="#7F1D1D" stroke-width="0.6"/>

  <!-- Surgical Scalpel beside tray -->
  <path d="M88 232 L134 256 L138 251 L92 227 Z" fill="#94A3B8" stroke="#0F172A" stroke-width="0.8"/>
  <path d="M134 256 L158 268 C 154 258, 146 253, 138 251 Z" fill="#E2E8F0" stroke="#0F172A" stroke-width="0.8"/>

  <!-- Fine-Point Forceps -->
  <path d="M180 256 L236 226 L239 229 L186 259 L242 233 L244 236 L180 262 Z" fill="#CBD5E1" stroke="#0F172A" stroke-width="0.8" stroke-linejoin="round"/>

  <!-- Hand Lens (×10 Magnifier) -->
  <circle cx="268" cy="222" r="18" fill="rgba(186,230,253,0.45)" stroke="#334155" stroke-width="3"/>
  <line x1="281" y1="235" x2="304" y2="256" stroke="#1E293B" stroke-width="5" stroke-linecap="round"/>

  <!-- Callout Labels -->
  <line x1="166" y1="156" x2="108" y2="66" stroke="#2448D8" stroke-width="0.8"/>
  <circle cx="166" cy="156" r="2" fill="#2448D8"/>
  <rect x="14" y="59" width="94" height="14" rx="3" fill="#FFFFFF" stroke="#2448D8" stroke-width="0.8"/>
  <text x="19" y="69" fill="#1A36A8" font-size="8" font-family="Inter" font-weight="600">Wax dissecting tray</text>

  <line x1="135" y1="126" x2="225" y2="66" stroke="#2448D8" stroke-width="0.8"/>
  <circle cx="135" cy="126" r="2" fill="#2448D8"/>
  <rect x="225" y="59" width="84" height="14" rx="3" fill="#FFFFFF" stroke="#2448D8" stroke-width="0.8"/>
  <text x="230" y="69" fill="#1A36A8" font-size="8" font-family="Inter" font-weight="600">Dissecting pins</text>

  <line x1="124" y1="248" x2="88" y2="270" stroke="#2448D8" stroke-width="0.8"/>
  <circle cx="124" cy="248" r="2" fill="#2448D8"/>
  <rect x="14" y="263" width="74" height="14" rx="3" fill="#FFFFFF" stroke="#2448D8" stroke-width="0.8"/>
  <text x="19" y="273" fill="#1A36A8" font-size="8" font-family="Inter" font-weight="600">Surgical scalpel</text>

  <line x1="215" y1="242" x2="215" y2="275" stroke="#2448D8" stroke-width="0.8"/>
  <circle cx="215" cy="242" r="2" fill="#2448D8"/>
  <rect x="168" y="275" width="88" height="14" rx="3" fill="#FFFFFF" stroke="#2448D8" stroke-width="0.8"/>
  <text x="173" y="285" fill="#1A36A8" font-size="8" font-family="Inter" font-weight="600">Blunt/fine forceps</text>

  <line x1="268" y1="204" x2="292" y2="188" stroke="#2448D8" stroke-width="0.8"/>
  <circle cx="268" cy="204" r="2" fill="#2448D8"/>
  <rect x="272" y="174" width="76" height="14" rx="3" fill="#FFFFFF" stroke="#2448D8" stroke-width="0.8"/>
  <text x="277" y="184" fill="#1A36A8" font-size="8" font-family="Inter" font-weight="600">Hand lens (×10)</text>
</svg>
