<svg viewBox="0 0 360 300" role="img" aria-label="Isometric drawing of a Solderless breadboard and digital multimeter" xmlns="http://www.w3.org/2000/svg" width="720" height="600">
  <!-- Isometric Solderless Breadboard -->
  <path d="M28 182 L144 242 L224 198 L108 138 Z" fill="#F8FAFC" stroke="#475569" stroke-width="1" stroke-linejoin="round"/>
  <path d="M28 182 L144 242 L144 252 L28 192 Z" fill="#CBD5E1" stroke="#475569" stroke-width="1"/>
  <path d="M144 242 L224 198 L224 208 L144 252 Z" fill="#94A3B8" stroke="#475569" stroke-width="1"/>
  <!-- Red & Blue Power Rails + Central IC Channel -->
  <line x1="42" y1="178" x2="148" y2="233" stroke="#EF4444" stroke-width="1.2"/>
  <line x1="46" y1="175" x2="152" y2="230" stroke="#2563EB" stroke-width="1.2"/>
  <line x1="68" y1="162" x2="174" y2="217" stroke="#94A3B8" stroke-width="3"/>

  <!-- Digital Multimeter (DMM) -->
  <rect x="228" y="76" width="96" height="156" rx="10" fill="#1E293B" stroke="#F59E0B" stroke-width="3"/>
  <!-- LCD Readout Screen -->
  <rect x="240" y="90" width="72" height="32" rx="4" fill="#A7F3D0" stroke="#065F46" stroke-width="1"/>
  <text x="306" y="112" text-anchor="end" fill="#064E3B" font-size="15" font-family="JetBrains Mono" font-weight="700">4.71 Ω</text>
  <!-- Rotary Range Selector Dial -->
  <circle cx="276" cy="162" r="24" fill="#334155" stroke="#94A3B8" stroke-width="1.2"/>
  <line x1="276" y1="162" x2="262" y2="146" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
  <!-- Input Jacks: 10A, COM, VΩmA -->
  <circle cx="252" cy="210" r="5" fill="#EF4444" stroke="#FFFFFF" stroke-width="1"/>
  <circle cx="276" cy="210" r="5" fill="#0F172A" stroke="#FFFFFF" stroke-width="1"/>
  <circle cx="300" cy="210" r="5" fill="#EF4444" stroke="#FFFFFF" stroke-width="1"/>

  <!-- Callouts -->
  <line x1="126" y1="190" x2="96" y2="112" stroke="#2448D8" stroke-width="0.8"/>
  <circle cx="126" cy="190" r="2" fill="#2448D8"/>
  <rect x="16" y="98" width="136" height="14" rx="3" fill="#FFFFFF" stroke="#2448D8" stroke-width="0.8"/>
  <text x="21" y="108" fill="#1A36A8" font-size="8" font-family="Inter" font-weight="600">5-tie terminal strips &amp; IC ravine</text>

  <line x1="276" y1="162" x2="196" y2="132" stroke="#2448D8" stroke-width="0.8"/>
  <circle cx="276" cy="162" r="2" fill="#2448D8"/>
  <rect x="120" y="118" width="96" height="14" rx="3" fill="#FFFFFF" stroke="#2448D8" stroke-width="0.8"/>
  <text x="125" y="128" fill="#1A36A8" font-size="8" font-family="Inter" font-weight="600">Rotary range selector</text>

  <line x1="276" y1="215" x2="246" y2="266" stroke="#2448D8" stroke-width="0.8"/>
  <circle cx="276" cy="215" r="2" fill="#2448D8"/>
  <rect x="180" y="266" width="132" height="14" rx="3" fill="#FFFFFF" stroke="#2448D8" stroke-width="0.8"/>
  <text x="185" y="276" fill="#1A36A8" font-size="8" font-family="Inter" font-weight="600">10A · COM · VΩmA input sockets</text>
</svg>
