<svg viewBox="0 0 360 300" role="img" aria-label="Isometric drawing of a Venturi tube and multi-tube manometer (Bernoulli apparatus)" xmlns="http://www.w3.org/2000/svg" width="720" height="600">
  <!-- Manometer backboard -->
  <rect x="78" y="34" width="204" height="146" rx="4" fill="#F8FAFC" stroke="#475569" stroke-width="1.2"/>

  <!-- 5 Vertical Piezometer Manometer Tubes showing pressure head drop at throat -->
  <rect x="104" y="46" width="8" height="156" fill="rgba(186,230,253,0.45)" stroke="#0284C7" stroke-width="0.8"/>
  <rect x="105" y="76" width="6" height="126" fill="rgba(37,99,235,0.65)"/>

  <rect x="140" y="46" width="8" height="162" fill="rgba(186,230,253,0.45)" stroke="#0284C7" stroke-width="0.8"/>
  <rect x="141" y="96" width="6" height="112" fill="rgba(37,99,235,0.65)"/>

  <!-- Throat tube (lowest static pressure head h_min where velocity is highest!) -->
  <rect x="176" y="46" width="8" height="168" fill="rgba(186,230,253,0.45)" stroke="#0284C7" stroke-width="0.8"/>
  <rect x="177" y="138" width="6" height="76" fill="rgba(37,99,235,0.65)"/>

  <rect x="212" y="46" width="8" height="162" fill="rgba(186,230,253,0.45)" stroke="#0284C7" stroke-width="0.8"/>
  <rect x="213" y="102" width="6" height="106" fill="rgba(37,99,235,0.65)"/>

  <rect x="248" y="46" width="8" height="156" fill="rgba(186,230,253,0.45)" stroke="#0284C7" stroke-width="0.8"/>
  <rect x="249" y="84" width="6" height="118" fill="rgba(37,99,235,0.65)"/>

  <!-- Horizontal Acrylic Venturi Tube (Converging -> Throat -> Diverging Diffuser) -->
  <path d="M54 196 L136 196 L168 208 L192 208 L232 196 L306 196 L306 232 L232 232 L192 220 L168 220 L136 232 L54 232 Z" fill="rgba(125,211,252,0.55)" stroke="#0369A1" stroke-width="1.3" stroke-linejoin="round"/>

  <!-- Callouts -->
  <line x1="180" y1="138" x2="216" y2="62" stroke="#2448D8" stroke-width="0.8"/>
  <circle cx="180" cy="138" r="2" fill="#2448D8"/>
  <rect x="186" y="48" width="144" height="14" rx="3" fill="#FFFFFF" stroke="#2448D8" stroke-width="0.8"/>
  <text x="191" y="58" fill="#1A36A8" font-size="8" font-family="Inter" font-weight="600">Piezometer tubes (static head h)</text>

  <line x1="180" y1="214" x2="180" y2="262" stroke="#2448D8" stroke-width="0.8"/>
  <circle cx="180" cy="214" r="2" fill="#2448D8"/>
  <rect x="118" y="262" width="124" height="14" rx="3" fill="#FFFFFF" stroke="#2448D8" stroke-width="0.8"/>
  <text x="123" y="272" fill="#1A36A8" font-size="8" font-family="Inter" font-weight="600">Venturi throat (max velocity v)</text>
</svg>
