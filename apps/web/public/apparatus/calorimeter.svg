<svg viewBox="0 0 360 300" role="img" aria-label="Isometric drawing of a Copper calorimeter with lagging and thermometer" xmlns="http://www.w3.org/2000/svg" width="720" height="600">
  <!-- Outer wooden / lagged insulating jacket -->
  <path d="M126 146 L126 246 A54 24 0 0 0 234 246 L234 146 Z" fill="#64748B" stroke="#0F172A" stroke-width="1"/>
  <ellipse cx="180" cy="146" rx="54" ry="22" fill="#E2E8F0" stroke="#0F172A" stroke-width="1"/>
  <!-- Inner copper calorimeter vessel -->
  <ellipse cx="180" cy="146" rx="38" ry="15" fill="#B45309" stroke="#78350F" stroke-width="1"/>
  <path d="M142 146 L142 226 A38 15 0 0 0 218 226 L218 146 Z" fill="rgba(217,119,6,0.55)" stroke="#78350F" stroke-width="1"/>

  <!-- Copper Stirrer loop -->
  <line x1="160" y1="90" x2="160" y2="205" stroke="#B45309" stroke-width="2.5" stroke-linecap="round"/>
  <ellipse cx="160" cy="208" rx="12" ry="5" fill="none" stroke="#B45309" stroke-width="2.2"/>

  <!-- Mercury / Alcohol Thermometer -->
  <rect x="184" y="34" width="8" height="176" rx="4" fill="rgba(224,242,254,0.8)" stroke="#334155" stroke-width="0.9"/>
  <rect x="186.5" y="106" width="3" height="102" fill="#EF4444"/>
  <circle cx="188" cy="210" r="6" fill="#EF4444" stroke="#7F1D1D" stroke-width="0.8"/>

  <!-- Callouts -->
  <line x1="188" y1="60" x2="236" y2="48" stroke="#2448D8" stroke-width="0.8"/>
  <circle cx="188" cy="60" r="2" fill="#2448D8"/>
  <rect x="236" y="41" width="110" height="14" rx="3" fill="#FFFFFF" stroke="#2448D8" stroke-width="0.8"/>
  <text x="241" y="51" fill="#1A36A8" font-size="8" font-family="Inter" font-weight="600">Thermometer (-10 to 110°C)</text>

  <line x1="160" y1="102" x2="112" y2="92" stroke="#2448D8" stroke-width="0.8"/>
  <circle cx="160" cy="102" r="2" fill="#2448D8"/>
  <rect x="36" y="85" width="76" height="14" rx="3" fill="#FFFFFF" stroke="#2448D8" stroke-width="0.8"/>
  <text x="41" y="95" fill="#1A36A8" font-size="8" font-family="Inter" font-weight="600">Copper stirrer</text>

  <line x1="210" y1="176" x2="254" y2="168" stroke="#2448D8" stroke-width="0.8"/>
  <circle cx="210" cy="176" r="2" fill="#2448D8"/>
  <rect x="254" y="161" width="96" height="14" rx="3" fill="#FFFFFF" stroke="#2448D8" stroke-width="0.8"/>
  <text x="259" y="171" fill="#1A36A8" font-size="8" font-family="Inter" font-weight="600">Inner copper vessel</text>

  <line x1="132" y1="210" x2="102" y2="226" stroke="#2448D8" stroke-width="0.8"/>
  <circle cx="132" cy="210" r="2" fill="#2448D8"/>
  <rect x="12" y="219" width="90" height="14" rx="3" fill="#FFFFFF" stroke="#2448D8" stroke-width="0.8"/>
  <text x="17" y="229" fill="#1A36A8" font-size="8" font-family="Inter" font-weight="600">Lagging (cotton wool)</text>
</svg>
